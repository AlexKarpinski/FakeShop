services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: development
      MONGO_URL: mongodb://mongo:27017/fakeshop
      JWT_SECRET: change-me
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
